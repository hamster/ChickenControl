<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">

  <!-- Sky -->
  <rect width="256" height="256" rx="24" fill="#2E86C1"/>

  <!-- Grass -->
  <rect x="0" y="196" width="256" height="60" rx="0" fill="#27AE60"/>
  <rect x="0" y="232" width="256" height="24" rx="0" fill="#1E8449"/>
  <ellipse cx="128" cy="196" rx="170" ry="18" fill="#2ECC71"/>

  <!-- Ground shadow under chicken -->
  <ellipse cx="128" cy="200" rx="46" ry="7" fill="rgba(0,0,0,0.18)"/>

  <!-- Tail feathers (left side, behind body) -->
  <ellipse cx="74" cy="138" rx="24" ry="10" fill="#F5F5F5" transform="rotate(-25 74 138)"/>
  <ellipse cx="68" cy="152" rx="22" ry="9" fill="#EEEEEE" transform="rotate(-50 68 152)"/>
  <ellipse cx="72" cy="125" rx="20" ry="9" fill="#FFFFFF" transform="rotate(-5 72 125)"/>

  <!-- Body -->
  <ellipse cx="130" cy="156" rx="54" ry="44" fill="#FFFFFF"/>

  <!-- Wing -->
  <ellipse cx="122" cy="160" rx="34" ry="21" fill="#EBEBEB"/>
  <ellipse cx="122" cy="162" rx="26" ry="14" fill="#E0E0E0"/>

  <!-- Neck -->
  <ellipse cx="163" cy="124" rx="17" ry="22" fill="#FFFFFF"/>

  <!-- Head -->
  <circle cx="166" cy="100" r="28" fill="#FFFFFF"/>

  <!-- Comb -->
  <ellipse cx="154" cy="73" rx="7" ry="12" fill="#C0392B"/>
  <ellipse cx="165" cy="69" rx="8" ry="14" fill="#E74C3C"/>
  <ellipse cx="176" cy="73" rx="7" ry="11" fill="#C0392B"/>

  <!-- Eye -->
  <circle cx="176" cy="95" r="5.5" fill="#1A252F"/>
  <circle cx="177.5" cy="93.5" r="2" fill="#FFFFFF"/>

  <!-- Beak -->
  <polygon points="192,97 210,103 192,109" fill="#F39C12"/>
  <!-- Beak detail line -->
  <line x1="192" y1="103" x2="210" y2="103" stroke="#D68910" stroke-width="1.5"/>

  <!-- Wattle -->
  <ellipse cx="190" cy="114" rx="7" ry="11" fill="#E74C3C"/>

  <!-- Legs -->
  <rect x="116" y="190" width="10" height="20" rx="3" fill="#F39C12"/>
  <rect x="138" y="190" width="10" height="20" rx="3" fill="#F39C12"/>

  <!-- Left foot toes -->
  <line x1="121" y1="210" x2="106" y2="218" stroke="#F39C12" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="121" y1="210" x2="121" y2="220" stroke="#F39C12" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="121" y1="210" x2="136" y2="218" stroke="#F39C12" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Right foot toes -->
  <line x1="143" y1="210" x2="128" y2="218" stroke="#F39C12" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="143" y1="210" x2="143" y2="220" stroke="#F39C12" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="143" y1="210" x2="158" y2="218" stroke="#F39C12" stroke-width="4.5" stroke-linecap="round"/>

</svg>
